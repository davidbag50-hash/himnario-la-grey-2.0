name: La Grey Cantos 2 Setup

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

jobs:
  setup:
    if: github.event.issue.user.login == github.repository_owner && github.event.issue.title == '[La Grey Setup] Cantos 2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build Cantos 2 migration
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/base.txt"
          node <<'NODE'
          const fs=require('fs'),vm=require('vm'),cp=require('child_process');
          const fail=m=>{throw new Error(m)};
          const replaceOnce=(src,a,b,label)=>{const i=src.indexOf(a);if(i<0)fail(`No se encontró ${label}`);if(src.indexOf(a,i+a.length)>=0)fail(`Patrón duplicado ${label}`);return src.slice(0,i)+b+src.slice(i+a.length)};
          const parse=(src,key)=>{const s={window:{}};vm.createContext(s);new vm.Script(src).runInContext(s,{timeout:1000});const a=s.window[key];if(!Array.isArray(a))fail(`${key} inválido`);return a};

          // Duplicar EXACTAMENTE los 8 cantos originales desde el último estado con IDs 1-8.
          const source=cp.execFileSync('git',['show','43b6b9c7cae1ff5363270ee87a0abe92eee669d2:songs.js'],{encoding:'utf8'});
          const old8=parse(source,'LAGREY_SONGS');
          if(old8.length!==8||old8.map(x=>x.id).join(',')!=='1,2,3,4,5,6,7,8')fail('La fuente histórica no contiene exactamente IDs 1-8');
          const v2=replaceOnce(source,'window.LAGREY_SONGS = [','window.LAGREY_SONGS_V2 = [','cabecera songs v2');
          const check8=parse(v2,'LAGREY_SONGS_V2');
          if(JSON.stringify(check8)!==JSON.stringify(old8))fail('La copia V2 no coincide con los 8 cantos originales');
          fs.writeFileSync('songs-v2.js',v2,'utf8');

          // Cargar la nueva fuente y añadir Cantos 2 junto a Cantos, sin borrar nada viejo.
          let html=fs.readFileSync('index.html','utf8');
          html=replaceOnce(html,'<script src="songs.js"></script>','<script src="songs.js"></script><script src="songs-v2.js"></script>','script songs.js');
          const homeRe=/<button class="exact-nav-btn" data-exact-nav="songs" data-nav="songs">[\s\S]*?<\/button>/;
          const hm=html.match(homeRe);if(!hm)fail('No se encontró botón Cantos del Home');
          const h2=hm[0].replace(/data-exact-nav="songs"/,'data-exact-nav="songs2"').replace(/data-nav="songs"/,'data-nav="songs2"').replace('<span>Cantos</span>','<span>Cantos 2</span>');
          html=html.replace(hm[0],hm[0]+h2);
          const oldInternal='<button data-nav="songs">🎵<span>Cantos</span></button>';
          html=replaceOnce(html,oldInternal,oldInternal+'<button data-nav="songs2">🎵<span>Cantos 2</span></button>','nav interno Cantos');
          fs.writeFileSync('index.html',html,'utf8');

          // Reutilizar la vista de listado/detalle, pero con una fuente de datos independiente.
          let app=fs.readFileSync('app.js','utf8');
          app=replaceOnce(app,'const songs=window.LAGREY_SONGS||[],CH=','const songs=window.LAGREY_SONGS||[],songs2=window.LAGREY_SONGS_V2||[],CH=','colección principal');
          app=replaceOnce(app,"let currentSong=null,lastSongList='cantos',","let currentSong=null,currentSongSource='main',lastSongList='cantos',",'estado currentSong');
          app=replaceOnce(app,"listing:lastSongList==='cantos'?'songs':'home'","listing:lastSongList==='cantos'?'songs':lastSongList==='cantos2'?'songs2':'home'",'nav activa listing');
          app=replaceOnce(app,"openSong(currentSong.id,false);","openSong(currentSong.id,false,currentSongSource);",'toggle notation song');
          app=replaceOnce(app,"function currentListSongs(){if(lastSongList==='fav')return songs.filter(s=>getFavs().includes(s.id));return songs.filter(s=>s.type===lastSongList)}","function currentListSongs(){if(lastSongList==='fav')return songs.filter(s=>getFavs().includes(s.id));if(lastSongList==='cantos2')return songs2;return songs.filter(s=>s.type===lastSongList)}",'currentListSongs');
          app=replaceOnce(app,"openSong(Number(b.dataset.song))","openSong(Number(b.dataset.song),true,lastSongList==='cantos2'?'cantos2':'main')",'abrir desde listado');
          app=replaceOnce(app,"function showSongList(type){lastSongList=type;showView('listing');$('listTitle').textContent=type==='cantos'?`🎵 ${appText('Cantos','Songs')}`:type==='himnos'?`🎼 ${appText('Himnos','Hymns')}`:`⭐ ${appText('Favoritos','Favorites')}`;renderSongList(currentListSongs())}","function showSongList(type){lastSongList=type;showView('listing');$('listTitle').textContent=type==='cantos'?`🎵 ${appText('Cantos','Songs')}`:type==='cantos2'?`🎵 ${appText('Cantos 2','Songs 2')}`:type==='himnos'?`🎼 ${appText('Himnos','Hymns')}`:`⭐ ${appText('Favoritos','Favorites')}`;renderSongList(currentListSongs())}",'showSongList');
          app=replaceOnce(app,"function openSong(id,scroll=true){currentSong=songs.find(s=>s.id===id);if(!currentSong)return;","function openSong(id,scroll=true,source='main'){currentSongSource=source;currentSong=(source==='cantos2'?songs2:songs).find(s=>s.id===id);if(!currentSong)return;",'openSong');
          app=replaceOnce(app,"else if(d==='songs')showSongList('cantos');else if(d==='hymns')","else if(d==='songs')showSongList('cantos');else if(d==='songs2')showSongList('cantos2');else if(d==='hymns')",'navigate songs2');
          fs.writeFileSync('app.js',app,'utf8');

          // Seis botones en la navegación inferior del Home durante esta fase de prueba.
          let css=fs.readFileSync('exact-home-v1.css','utf8');
          css=replaceOnce(css,'grid-template-columns:repeat(5,1fr)','grid-template-columns:repeat(6,1fr)','grid nav Home');
          fs.writeFileSync('exact-home-v1.css',css,'utf8');

          // Precargar la nueva fuente y subir cache partiendo del valor ACTUAL.
          let sw=fs.readFileSync('sw.js','utf8');
          sw=replaceOnce(sw,"'./songs.js','./hymns.js'","'./songs.js','./songs-v2.js','./hymns.js'",'ASSETS songs-v2');
          const cm=sw.match(/const CACHE='la-grey-v3-(\d+)[^']*';/);if(!cm)fail('CACHE actual no reconocido');
          sw=sw.replace(/const CACHE='[^']+';/,`const CACHE='la-grey-v3-${Number(cm[1])+1}-cantos-2';`);
          fs.writeFileSync('sw.js',sw,'utf8');

          // Validaciones antes del commit.
          for(const f of ['songs-v2.js','app.js','sw.js']){
            const r=cp.spawnSync('node',['--check',f],{encoding:'utf8'});if(r.status!==0)fail(`${f} no compila: ${r.stderr}`);
          }
          const final8=parse(fs.readFileSync('songs-v2.js','utf8'),'LAGREY_SONGS_V2');
          if(final8.length!==8||final8.some((x,i)=>x.id!==i+1))fail('songs-v2.js no terminó con exactamente IDs 1-8');
          if(!fs.readFileSync('index.html','utf8').includes('data-nav="songs2"'))fail('Cantos 2 no quedó conectado');
          console.log('Cantos 2 validado: copia independiente exacta de los 8 originales.');
          NODE

      - name: Commit and push
        run: |
          set -euo pipefail
          BASE="$(cat "$RUNNER_TEMP/base.txt")"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE" || { echo 'main cambió; abortando'; exit 1; }
          git config user.name "La Grey Maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add songs-v2.js index.html app.js exact-home-v1.css sw.js
          git diff --cached --check
          git commit -m "Crear nueva pestaña Cantos 2 con 8 cantos originales"
          git push origin HEAD:main

      - name: Report success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "✅ Cantos 2 creado con los 8 cantos originales. La pestaña vieja permanece intacta."
          gh issue close "$ISSUE_NUMBER" --reason completed

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue comment "$ISSUE_NUMBER" --body "❌ La migración a Cantos 2 se abortó; no se publicó una migración parcial."
