name: La Grey Build Mix Video

on:
  push:
    paths:
      - '.github/scripts/lagrey-build-mix-video.py'
      - '.github/workflows/lagrey-build-mix-video.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HF_HUB_DISABLE_XET: '1'
      VOICE1_PREVIEW_URL: 'https://resource2.heygen.ai/voice_preview/RL5lt8U5iZPap1qaQQuU.mp3'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg librsvg2-bin

      - name: Install OpenVoice V2 and MeloTTS
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install 'setuptools==80.9.0'
          python -m pip install 'torch==2.1.2' 'torchaudio==2.1.2' --index-url https://download.pytorch.org/whl/cpu
          git clone --depth 1 https://github.com/myshell-ai/OpenVoice.git /tmp/OpenVoice
          python -m pip install 'numpy==1.22.0' 'librosa==0.9.1' 'pydub==0.25.1' 'wavmark==0.0.3' 'eng_to_ipa==0.0.2' 'inflect==7.0.0' 'unidecode==1.3.7' 'pypinyin==0.50.0' 'cn2an==0.5.22' 'jieba==0.42.1' 'langid==1.1.6'
          python -m pip install -e /tmp/OpenVoice --no-deps
          python -m pip install git+https://github.com/myshell-ai/MeloTTS.git
          python -m pip install 'huggingface_hub<1.0' 'setuptools==80.9.0' 'numpy==1.22.0'
          python -c "import pkg_resources, librosa; print('audio dependencies ready')"

      - name: Prepare MeloTTS dictionary
        run: |
          python - <<'PY'
          from pathlib import Path
          import unidic
          import unidic_lite
          src = Path(unidic_lite.DICDIR)
          dst = Path(unidic.DICDIR)
          dst.mkdir(parents=True, exist_ok=True)
          for item in src.iterdir():
              target = dst / item.name
              if target.exists() or target.is_symlink():
                  continue
              target.symlink_to(item)
          print('MeloTTS dictionary:', dst)
          PY
          python -c "import MeCab; MeCab.Tagger(); print('mecab ready')"

      - name: Download OpenVoice V2 checkpoints
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id='myshell-ai/OpenVoiceV2',
              local_dir='/tmp/OpenVoiceV2',
              local_dir_use_symlinks=False,
          )
          PY
          find /tmp/OpenVoiceV2 -maxdepth 3 -type f | head -40

      - name: Download voice 1 reference
        run: |
          curl -fL --retry 4 --retry-delay 3 "$VOICE1_PREVIEW_URL" -o /tmp/voice1.mp3
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 /tmp/voice1.mp3

      - name: Build Mix lesson video
        run: python .github/scripts/lagrey-build-mix-video.py

      - name: Validate final MP4
        run: |
          test -s academy-videos/voice-advanced-01-mix.mp4
          test "$(stat -c%s academy-videos/voice-advanced-01-mix.mp4)" -gt 1000000
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -of default=nw=1 academy-videos/voice-advanced-01-mix.mp4
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,sample_rate -of default=nw=1 academy-videos/voice-advanced-01-mix.mp4

      - name: Commit Mix video
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '418982d5b282a4bb21c3d157+github-actions[bot]@users.noreply.github.com'
          git add academy-videos/voice-advanced-01-mix.mp4
          git commit -m 'Agregar video Mezcla vocal con voz 1'
          git push
