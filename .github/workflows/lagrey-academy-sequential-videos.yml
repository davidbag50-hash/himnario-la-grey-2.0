name: La Grey Academy Sequential Videos

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lagrey-academy-sequential-videos.yml'

permissions:
  contents: write

concurrency:
  group: lagrey-academy-video-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      HF_HUB_DISABLE_XET: '1'
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg librsvg2-bin

      - name: Install Chatterbox Multilingual V3
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install 'torch==2.6.0' 'torchaudio==2.6.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'chatterbox-tts==0.1.7'
          python -m pip install --no-deps --force-reinstall git+https://github.com/resemble-ai/chatterbox.git@master
          python - <<'PY'
          import torch, torchaudio
          from chatterbox.mtl_tts import ChatterboxMultilingualTTS
          print('torch', torch.__version__, 'torchaudio', torchaudio.__version__)
          import inspect
          print('languages', ChatterboxMultilingualTTS.get_supported_languages().get('es'))
          print('from_pretrained', inspect.signature(ChatterboxMultilingualTTS.from_pretrained))
          PY

      - name: Extract Passaggio voice reference
        run: |
          test -s academy-videos/voice-advanced-02-passaggio.mp4
          ffmpeg -y -v error -ss 2 -t 18 -i academy-videos/voice-advanced-02-passaggio.mp4 -vn -af loudnorm=I=-18:TP=-2:LRA=7 -ar 24000 -ac 1 -c:a pcm_s16le /tmp/passaggio-voice.wav
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 /tmp/passaggio-voice.wav

      - name: Build and publish Academy videos one by one
        run: python .github/scripts/lagrey-build-academy-sequential.py
