name: La Grey Academy Sequential Videos

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lagrey-academy-sequential-videos.yml'

permissions:
  contents: write

concurrency:
  group: lagrey-academy-video-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      HF_HUB_DISABLE_XET: '1'
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg librsvg2-bin

      - name: Install OpenVoice V2 and MeloTTS
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install 'torch==2.1.2' 'torchaudio==2.1.2' --index-url https://download.pytorch.org/whl/cpu
          git clone --depth 1 https://github.com/myshell-ai/OpenVoice.git /tmp/OpenVoice
          python -m pip install 'numpy==1.22.0' 'librosa==0.9.1' 'pydub==0.25.1' 'wavmark==0.0.3' 'eng_to_ipa==0.0.2' 'inflect==7.0.0' 'unidecode==1.3.7' 'pypinyin==0.50.0' 'cn2an==0.5.22' 'jieba==0.42.1' 'langid==1.1.6'
          python -m pip install -e /tmp/OpenVoice --no-deps
          python -m pip install git+https://github.com/myshell-ai/MeloTTS.git
          python -m pip install 'huggingface_hub<1.0' 'setuptools==80.9.0' 'numpy==1.22.0'
          python -c "import pkg_resources, librosa; print('audio dependencies ready')"

      - name: Prepare MeloTTS dictionary
        run: |
          python - <<'PY'
          from pathlib import Path
          import unidic
          import unidic_lite
          src = Path(unidic_lite.DICDIR)
          dst = Path(unidic.DICDIR)
          dst.mkdir(parents=True, exist_ok=True)
          for item in src.iterdir():
              target = dst / item.name
              if target.exists() or target.is_symlink():
                  continue
              target.symlink_to(item)
          print('MeloTTS dictionary:', dst)
          PY
          python -c "import MeCab; MeCab.Tagger(); print('mecab ready')"

      - name: Download OpenVoice V2 checkpoints
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id='myshell-ai/OpenVoiceV2',
              local_dir='/tmp/OpenVoiceV2',
              local_dir_use_symlinks=False,
          )
          PY

      - name: Extract Passaggio voice reference
        run: |
          test -s academy-videos/voice-advanced-02-passaggio.mp4
          ffmpeg -y -v error -ss 8 -t 70 -i academy-videos/voice-advanced-02-passaggio.mp4 -vn -ar 24000 -ac 1 -c:a pcm_s16le /tmp/passaggio-voice.wav
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 /tmp/passaggio-voice.wav

      - name: Build and publish Academy videos one by one
        run: python .github/scripts/lagrey-build-academy-sequential.py
