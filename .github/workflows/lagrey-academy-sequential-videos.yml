name: La Grey Academy Sequential Videos

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lagrey-academy-sequential-videos.yml'

permissions:
  contents: write

concurrency:
  group: lagrey-academy-video-production
  cancel-in-progress: true

jobs:
  stop:
    runs-on: ubuntu-latest
    steps:
      - name: Stop experimental voice generation
        run: echo "Academy voice generation paused until the exact Passaggio voice is available."
