name: La Grey · Publicar video Passaggio

on:
  push:
    paths:
      - '.github/workflows/lagrey-passaggio-video-publish.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VIDEO_URL: 'https://files2.heygen.ai/aws_pacific/avatar_tmp/1c38b7140588469abcab714b8b7a2ac1/559304bb03005b00f6323ebf691dc611.mp4?Expires=1789867522&Signature=GbE5WlR8Djq722ShX4AE-rx7lYLaMBv8DxLOnszIyxBTaK-I5xCsYK7gzrjFT1rDWtH-1ygJkRYPqy~s40llaeENm~4V5qhEJ2RVmsiYssIiJHoNJqkLOpQp~QjSTkTOYMlKCY-jLZO1pF6wuWehT-oypkxyK30xmfv3bVOSR-D8ox7jPoKlzmy31M7lcXq0VdUZi-abb4niRA5QS2bJx15UvX6axe3Mw-BJQf0SSr0h-9e4JRED0rZ1P~H9AOmLTUnZwo881z8E4Jvx3eQNJaDpoUALNniT222i4GcbLo6Glle1y4r0kKLtU9YGI~22Sj14F1xjMF8pUWVmpx1rHA__&Key-Pair-Id=K38HBHX5LX3X2H'
      TARGET: academy-videos/voice-advanced-02-passaggio.mp4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Descargar MP4 final
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p academy-videos
          curl -L --fail --retry 3 --retry-delay 2 "$VIDEO_URL" -o "$TARGET"
          test -s "$TARGET"
          bytes=$(stat -c%s "$TARGET")
          if [ "$bytes" -lt 100000 ]; then
            echo "MP4 demasiado pequeño: $bytes bytes" >&2
            exit 1
          fi
          echo "MP4 descargado: $bytes bytes"
      - name: Validar video
        shell: bash
        run: |
          set -euo pipefail
          file "$TARGET"
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height -of default=noprint_wrappers=1 "$TARGET"
      - name: Publicar en la rama principal
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$TARGET"
          if git diff --cached --quiet; then
            echo "El MP4 ya estaba publicado."
            exit 0
          fi
          git commit -m "Agregar video final de Passaggio a Academia La Grey"
          git push origin HEAD:main
