name: La Grey Copy Song 9 To V2

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  copy:
    if: github.event.issue.user.login == github.repository_owner && github.event.issue.title == '[La Grey Copy] El Dios que adoramos'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Copy and validate
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm'),cp=require('child_process');
          const parse=(src,key)=>{const s={window:{}};vm.createContext(s);new vm.Script(src).runInContext(s);if(!Array.isArray(s.window[key]))throw Error(key+' inválido');return s.window[key]};
          const old=fs.readFileSync('songs.js','utf8'), target=fs.readFileSync('songs-v2.js','utf8');
          if(!target.startsWith('window.LAGREY_SONGS_V2 = [')||!target.trimEnd().endsWith('];'))throw Error('songs-v2.js no canónico');
          const source=parse(old,'LAGREY_SONGS'), before=parse(target,'LAGREY_SONGS_V2');
          const song=source.find(x=>Number(x.id)===9&&x.title==='El Dios que adoramos');
          if(!song)throw Error('No existe fuente ID 9');
          if(before.some(x=>x.title===song.title&&x.artist===song.artist))throw Error('Ya existe en Cantos 2');
          const id=Math.max(...before.map(x=>Number(x.id)),0)+1;
          const obj={...song,id};
          const keys=['id','title','artist','type','tone']; if('bpm' in obj)keys.push('bpm'); keys.push('content');
          const lines=['  {',...keys.map((k,i)=>`    ${JSON.stringify(k)}: ${k==='id'?obj[k]:JSON.stringify(obj[k])}${i<keys.length-1?',':''}`),'  }'];
          const m=/\n\];\s*$/.exec(target);if(!m)throw Error('Cierre no encontrado');
          const next=target.slice(0,m.index)+',\n'+lines.join('\n')+target.slice(m.index);
          const after=parse(next,'LAGREY_SONGS_V2');
          if(after.length!==before.length+1||!after.some(x=>Number(x.id)===id&&x.title===song.title&&x.content===song.content))throw Error('Validación de inserción falló');
          for(const x of before)if(!after.some(y=>Number(y.id)===Number(x.id)))throw Error('Desapareció ID '+x.id);
          fs.writeFileSync('songs-v2.js',next); if(cp.spawnSync('node',['--check','songs-v2.js']).status!==0)throw Error('songs-v2.js no compila');
          const sw=fs.readFileSync('sw.js','utf8'),re=/const CACHE\s*=\s*(['"])([^'"]+)\1\s*;/,cm=sw.match(re);if(!cm)throw Error('CACHE no encontrado');
          const n=cm[2].match(/^la-grey-v3-(\d+)(?:-|$)/);if(!n)throw Error('CACHE inválido');
          const cache=`la-grey-v3-${Number(n[1])+1}-song-el-dios-que-adoramos`;
          fs.writeFileSync('sw.js',sw.replace(re,`const CACHE='${cache}';`)); if(cp.spawnSync('node',['--check','sw.js']).status!==0)throw Error('sw.js no compila');
          console.log(`OK ${before.length}->${after.length}; ID ${id}; CACHE ${cm[2]} -> ${cache}`);
          NODE

      - name: Commit and push
        run: |
          git config user.name "La Grey Maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add songs-v2.js sw.js
          git diff --cached --check
          test "$(git diff --cached --name-only | sort)" = "$(printf 'songs-v2.js\nsw.js')"
          git commit -m "Agregar canto El Dios que adoramos a Cantos 2"
          git push origin HEAD:main

      - name: Close request
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "✅ El Dios que adoramos copiado y validado en Cantos 2."
          gh issue close "${{ github.event.issue.number }}" --reason completed
