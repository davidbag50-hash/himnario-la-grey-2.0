name: La Grey - Ajustar video inline de Academia

on:
  push:
    paths:
      - '.github/workflows/lagrey-academy-inline-video-fix.yml'
      - '.github/scripts/lagrey-academy-inline-video-fix.py'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar cambios canónicos
        run: python3 .github/scripts/lagrey-academy-inline-video-fix.py
      - name: Validar implementación
        shell: bash
        run: |
          set -euo pipefail
          node --check voice.js
          grep -q 'preload="metadata" data-academy-video' voice.js
          grep -q 'data-academy-fullscreen' voice.js
          grep -q 'loadedmetadata' voice.js
          grep -q 'la-grey-v3-201-academy-video-inline' sw.js
          git diff --check
          changed=$(git diff --name-only | sort | tr '\n' ' ')
          echo "Cambios: $changed"
          test "$changed" = "sw.js voice.css voice.js "
      - name: Publicar cambios canónicos
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add voice.js voice.css sw.js
          git commit -m "Mostrar video de Academia inline y permitir pantalla completa"
          git push origin HEAD:main
