name: La Grey Library Ingest

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

concurrency:
  group: lagrey-library-ingest-main
  cancel-in-progress: false

jobs:
  song:
    if: github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, '[La Grey Song]')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Validate current library
        run: node .github/scripts/lagrey-library-validate.js

      - name: Build and validate song
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: node .github/scripts/lagrey-song-ingest.js

      - name: Validate candidate library
        run: node .github/scripts/lagrey-library-validate.js

      - name: Commit and push
        if: env.LAGREY_DRY_RUN != 'true'
        run: |
          set -euo pipefail
          BASE="$(cat "$RUNNER_TEMP/lagrey-base.txt")"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE" || { echo 'main cambió durante la operación; abortando.'; exit 1; }
          git config user.name "La Grey Maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add songs.js sw.js
          git diff --cached --check
          CHANGED="$(git diff --cached --name-only | sort)"
          EXPECTED="$(printf 'songs.js\nsw.js')"
          test "$CHANGED" = "$EXPECTED" || { echo "Archivos inesperados: $CHANGED"; exit 1; }
          test "$(git hash-object songs.js)" = "$(cat "$RUNNER_TEMP/songs-blob.txt")"
          test "$(git hash-object sw.js)" = "$(cat "$RUNNER_TEMP/sw-blob.txt")"
          git commit -F "$RUNNER_TEMP/lagrey-message.txt"
          git push origin HEAD:main

      - name: Verify published commit
        if: env.LAGREY_DRY_RUN != 'true'
        run: |
          set -euo pipefail
          git fetch origin main
          HEAD_SHA="$(git rev-parse HEAD)"
          test "$(git rev-parse origin/main)" = "$HEAD_SHA"
          test "$(git rev-parse HEAD:songs.js)" = "$(cat "$RUNNER_TEMP/songs-blob.txt")"
          test "$(git rev-parse HEAD:sw.js)" = "$(cat "$RUNNER_TEMP/sw-blob.txt")"
          BASE="$(cat "$RUNNER_TEMP/lagrey-base.txt")"
          CHANGED="$(git diff --name-only "$BASE" "$HEAD_SHA" | sort)"
          EXPECTED="$(printf 'songs.js\nsw.js')"
          test "$CHANGED" = "$EXPECTED" || { echo "El commit publicado contiene archivos inesperados: $CHANGED"; exit 1; }
          node .github/scripts/lagrey-library-validate.js

      - name: Report success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          RESULT="$(cat "$RUNNER_TEMP/lagrey-result.txt")"
          if [ "$LAGREY_DRY_RUN" = "true" ]; then
            gh issue comment "$ISSUE_NUMBER" --body "✅ Dry-run de canto correcto. No se modificó la biblioteca. $RESULT"
          else
            gh issue comment "$ISSUE_NUMBER" --body "✅ Canto integrado, publicado y verificado. $RESULT"
          fi
          gh issue close "$ISSUE_NUMBER" --reason completed

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue comment "$ISSUE_NUMBER" --body "❌ Operación de canto abortada de forma segura. No considerar publicado ningún cambio hasta verificar la biblioteca."

  hymn:
    if: github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, '[La Grey Hymn]')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Build and validate hymn
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: node .github/scripts/lagrey-hymn-ingest.js

      - name: Commit and push
        if: env.LAGREY_DRY_RUN != 'true'
        run: |
          set -euo pipefail
          BASE="$(cat "$RUNNER_TEMP/lagrey-base.txt")"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE" || { echo 'main cambió durante la operación; abortando.'; exit 1; }
          mapfile -t FILES < "$RUNNER_TEMP/lagrey-expected-files.txt"
          git config user.name "La Grey Maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add -- "${FILES[@]}"
          git diff --cached --check
          CHANGED="$(git diff --cached --name-only | sort)"
          EXPECTED="$(sort "$RUNNER_TEMP/lagrey-expected-files.txt")"
          test "$CHANGED" = "$EXPECTED" || { echo "Archivos inesperados: $CHANGED"; exit 1; }
          while IFS=$'\t' read -r HASH FILE; do
            test "$(git hash-object "$FILE")" = "$HASH" || { echo "Hash inesperado: $FILE"; exit 1; }
          done < "$RUNNER_TEMP/lagrey-hashes.txt"
          git commit -F "$RUNNER_TEMP/lagrey-message.txt"
          git push origin HEAD:main

      - name: Verify published commit
        if: env.LAGREY_DRY_RUN != 'true'
        run: |
          set -euo pipefail
          git fetch origin main
          HEAD_SHA="$(git rev-parse HEAD)"
          test "$(git rev-parse origin/main)" = "$HEAD_SHA"
          while IFS=$'\t' read -r HASH FILE; do
            test "$(git rev-parse "HEAD:$FILE")" = "$HASH" || { echo "Blob publicado inesperado: $FILE"; exit 1; }
          done < "$RUNNER_TEMP/lagrey-hashes.txt"
          BASE="$(cat "$RUNNER_TEMP/lagrey-base.txt")"
          CHANGED="$(git diff --name-only "$BASE" "$HEAD_SHA" | sort)"
          EXPECTED="$(sort "$RUNNER_TEMP/lagrey-expected-files.txt")"
          test "$CHANGED" = "$EXPECTED" || { echo "El commit publicado contiene archivos inesperados: $CHANGED"; exit 1; }
          node .github/scripts/lagrey-library-validate.js

      - name: Report success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          RESULT="$(cat "$RUNNER_TEMP/lagrey-result.txt")"
          if [ "$LAGREY_DRY_RUN" = "true" ]; then
            gh issue comment "$ISSUE_NUMBER" --body "✅ Dry-run de himno correcto. No se modificó la biblioteca. $RESULT"
          else
            gh issue comment "$ISSUE_NUMBER" --body "✅ Himno integrado, publicado y verificado. $RESULT"
          fi
          gh issue close "$ISSUE_NUMBER" --reason completed

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue comment "$ISSUE_NUMBER" --body "❌ Operación de himno abortada de forma segura. No considerar publicado ningún cambio hasta verificar la biblioteca."
