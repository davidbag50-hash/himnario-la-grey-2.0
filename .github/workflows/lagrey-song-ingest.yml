name: La Grey Song Ingest

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

concurrency:
  group: lagrey-song-ingest-main
  cancel-in-progress: false

jobs:
  ingest:
    if: github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, '[La Grey Song]')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Build and validate
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: node .github/scripts/lagrey-song-ingest.js

      - name: Commit and push
        if: env.LAGREY_DRY_RUN != 'true'
        run: |
          set -euo pipefail
          BASE="$(cat "$RUNNER_TEMP/lagrey-base.txt")"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE" || { echo 'main cambió durante la operación; abortando.'; exit 1; }

          git config user.name "La Grey Maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add songs.js sw.js
          git diff --cached --check

          CHANGED="$(git diff --cached --name-only | sort)"
          EXPECTED="$(printf 'songs.js\nsw.js')"
          test "$CHANGED" = "$EXPECTED" || { echo "Archivos inesperados: $CHANGED"; exit 1; }
          test "$(git hash-object songs.js)" = "$(cat "$RUNNER_TEMP/songs-blob.txt")"
          test "$(git hash-object sw.js)" = "$(cat "$RUNNER_TEMP/sw-blob.txt")"

          git commit -F "$RUNNER_TEMP/lagrey-message.txt"
          git push origin HEAD:main

      - name: Verify published commit
        if: env.LAGREY_DRY_RUN != 'true'
        run: |
          set -euo pipefail
          git fetch origin main
          HEAD_SHA="$(git rev-parse HEAD)"
          test "$(git rev-parse origin/main)" = "$HEAD_SHA"
          test "$(git rev-parse HEAD:songs.js)" = "$(cat "$RUNNER_TEMP/songs-blob.txt")"
          test "$(git rev-parse HEAD:sw.js)" = "$(cat "$RUNNER_TEMP/sw-blob.txt")"
          BASE="$(cat "$RUNNER_TEMP/lagrey-base.txt")"
          CHANGED="$(git diff --name-only "$BASE" "$HEAD_SHA" | sort)"
          EXPECTED="$(printf 'songs.js\nsw.js')"
          test "$CHANGED" = "$EXPECTED" || { echo "El commit publicado contiene archivos inesperados: $CHANGED"; exit 1; }
          node --check songs.js
          node --check sw.js

      - name: Report success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          RESULT="$(cat "$RUNNER_TEMP/lagrey-result.txt")"
          if [ "$LAGREY_DRY_RUN" = "true" ]; then
            gh issue comment "$ISSUE_NUMBER" --body "✅ Dry-run correcto. No se modificaron songs.js ni sw.js. $RESULT"
          else
            gh issue comment "$ISSUE_NUMBER" --body "✅ Canto integrado, publicado y verificado. $RESULT"
          fi
          gh issue close "$ISSUE_NUMBER" --reason completed

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "❌ Operación abortada de forma segura. No considerar publicado el canto; songs.js y sw.js deben verificarse antes de reintentar."
