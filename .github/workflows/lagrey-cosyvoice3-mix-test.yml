name: La Grey CosyVoice3 Mix Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lagrey-cosyvoice3-mix-test.yml'
      - '.github/scripts/lagrey-cosyvoice3-mix-test.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lagrey-cosyvoice3-mix-test
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install media and client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg librsvg2-bin
          python -m pip install --upgrade pip
          python -m pip install 'gradio_client>=1.13,<2'

      - name: Build one CosyVoice3 test video
        run: python .github/scripts/lagrey-cosyvoice3-mix-test.py
