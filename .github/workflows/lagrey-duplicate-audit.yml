name: La Grey Duplicate Audit

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write

concurrency:
  group: lagrey-duplicate-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, '[La Grey Duplicate Audit]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
      - name: Validate current library
        run: node .github/scripts/lagrey-library-validate.js
      - name: Audit 41 title+artist collisions
        run: python3 .github/scripts/lagrey-duplicate-audit.py
      - name: Publish report
        env:
          GH_TOKEN: '${{ github.token }}'
          ISSUE_NUMBER: '${{ github.event.issue.number }}'
        run: |
          gh issue comment "$ISSUE_NUMBER" --body-file /tmp/lagrey-duplicate-audit.md
          gh issue close "$ISSUE_NUMBER" --reason completed
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: '${{ github.token }}'
          ISSUE_NUMBER: '${{ github.event.issue.number }}'
        run: gh issue comment "$ISSUE_NUMBER" --body "❌ La auditoría se abortó sin modificar el catálogo."
