name: La Grey Academy AI Audio

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/lagrey-academy-audio-publish.py'
      - '.github/workflows/lagrey-academy-audio-publish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Integrate AI narration
        run: python3 .github/scripts/lagrey-academy-audio-publish.py
      - name: Validate candidate
        run: |
          set -euo pipefail
          node --check voice.js
          node .github/scripts/lagrey-library-validate.js
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf 'sw.js\nvoice.js')"
          grep -q "la-grey-v3-199-academy-ai-audio" sw.js
          grep -q "academy-audio" voice.js
          grep -q "resource2.heygen.ai" voice.js
      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "La Grey Maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add voice.js sw.js
          git commit -m "Integrar narración IA en Academia vocal"
          git push origin HEAD:main
      - name: Verify
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          node --check voice.js
          node .github/scripts/lagrey-library-validate.js
          grep -q "la-grey-v3-199-academy-ai-audio" sw.js
          grep -q "academy-audio" voice.js
