name: La Grey Academy Progress

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/lagrey-academy-progress-publish.py'
      - '.github/workflows/lagrey-academy-progress-publish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Integrate Academy progress
        run: python3 .github/scripts/lagrey-academy-progress-publish.py
      - name: Validate candidate
        run: |
          set -euo pipefail
          node --check voice.js
          node .github/scripts/lagrey-library-validate.js
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf 'sw.js\nvoice.css\nvoice.js')"
          grep -q "lagrey_academy_voice_progress_v1" voice.js
          grep -q "data-academy-complete" voice.js
          grep -q "academy-progress-card" voice.css
          grep -q "la-grey-v3-200-academy-progress" sw.js
      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "La Grey Maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add voice.js voice.css sw.js
          git commit -m "Añadir progreso local a Academia vocal"
          git push origin HEAD:main
      - name: Verify
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          node --check voice.js
          node .github/scripts/lagrey-library-validate.js
          grep -q "la-grey-v3-200-academy-progress" sw.js
          grep -q "lagrey_academy_voice_progress_v1" voice.js
