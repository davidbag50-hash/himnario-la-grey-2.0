name: La Grey Academy Visuals

on:
  push:
    paths:
      - '.github/scripts/lagrey-academy-all-visuals.py'
      - '.github/workflows/lagrey-academy-all-visuals.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate academy visuals
        run: python .github/scripts/lagrey-academy-all-visuals.py
      - name: Validate generated scenes
        run: |
          test "$(find academy-videos -path '*/scene-*.svg' | wc -l)" -ge 48
          git diff --check
      - name: Commit generated visuals
        run: |
          if git diff --quiet -- academy-videos; then
            echo 'No visual changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add academy-videos
          git commit -m 'Generar visuales de clases de Academia'
          git push
