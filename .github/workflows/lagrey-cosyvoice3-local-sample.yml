name: La Grey CosyVoice3 Local Sample

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lagrey-cosyvoice3-local-sample.yml'
      - '.github/scripts/lagrey-cosyvoice3-local-sample.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lagrey-cosyvoice3-local-sample
  cancel-in-progress: true

jobs:
  build-sample:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - name: Checkout La Grey
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg librsvg2-bin sox libsox-dev git
          sudo apt-get clean
          df -h /

      - name: Clone CosyVoice source
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/FunAudioLLM/CosyVoice.git /tmp/CosyVoice
          python - <<'PY'
          from pathlib import Path
          p = Path('/tmp/CosyVoice/cosyvoice/llm/llm.py')
          s = p.read_text(encoding='utf-8')
          old_import = 'from transformers import Qwen2ForCausalLM'
          new_import = 'from transformers import Qwen2ForCausalLM, AutoConfig'
          old_init = 'self.model = Qwen2ForCausalLM.from_pretrained(pretrain_path)'
          new_init = 'self.model = Qwen2ForCausalLM(AutoConfig.from_pretrained(pretrain_path))'
          if old_import not in s or old_init not in s:
              raise SystemExit('CosyVoice Qwen patch target changed')
          s = s.replace(old_import, new_import, 1).replace(old_init, new_init, 1)
          p.write_text(s, encoding='utf-8')
          print('Patched Qwen2Encoder to avoid duplicate pretrained weights.')
          PY

      - name: Install CPU inference dependencies
        run: |
          python -m pip install --upgrade --no-cache-dir pip wheel 'setuptools==80.9.0'
          python -m pip install --no-cache-dir 'torch==2.3.1' 'torchaudio==2.3.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir --no-build-isolation 'openai-whisper==20231117'
          python -m pip install --no-cache-dir \
            'conformer==0.3.2' \
            'diffusers==0.29.0' \
            'gdown==5.1.0' \
            'hydra-core==1.3.2' \
            'HyperPyYAML==1.2.3' \
            'inflect==7.3.1' \
            'librosa==0.10.2' \
            'lightning==2.2.4' \
            'matplotlib==3.7.5' \
            'modelscope==1.20.0' \
            'networkx==3.1' \
            'numpy==1.26.4' \
            'omegaconf==2.3.0' \
            'onnx==1.16.0' \
            'onnxruntime==1.18.0' \
            'protobuf==4.25.3' \
            'rich==13.7.1' \
            'soundfile==0.12.1' \
            'transformers==4.51.3' \
            'x-transformers==2.11.24' \
            'wetext==0.0.4' \
            'wget==3.2'
          df -h /

      - name: Download only required CosyVoice3 model files
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download
          files = [
              'cosyvoice3.yaml',
              'campplus.onnx',
              'flow.pt',
              'hift.pt',
              'llm.pt',
              'speech_tokenizer_v3.onnx',
              'CosyVoice-BlankEN/config.json',
              'CosyVoice-BlankEN/generation_config.json',
              'CosyVoice-BlankEN/merges.txt',
              'CosyVoice-BlankEN/tokenizer_config.json',
              'CosyVoice-BlankEN/vocab.json',
          ]
          path = snapshot_download(
              repo_id='FunAudioLLM/Fun-CosyVoice3-0.5B-2512',
              local_dir='/tmp/cosyvoice3-model',
              allow_patterns=files,
          )
          print('Model:', path)
          PY
          find /tmp/cosyvoice3-model -type f -printf '%p %s bytes\n' | sort
          du -sh /tmp/cosyvoice3-model
          df -h /

      - name: Generate local CosyVoice3 sample
        run: python .github/scripts/lagrey-cosyvoice3-local-sample.py
