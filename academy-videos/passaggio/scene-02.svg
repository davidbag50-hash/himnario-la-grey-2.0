<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#071e2a"/><stop offset="1" stop-color="#0b5360"/></linearGradient><linearGradient id="r"><stop stop-color="#4c9bb2"/><stop offset=".48" stop-color="#71ddd5"/><stop offset=".62" stop-color="#efffff"/><stop offset="1" stop-color="#8bd8dc"/></linearGradient></defs><rect width="1280" height="720" fill="url(#b)"/><text x="70" y="82" fill="#9fe8e2" font-family="Arial" font-size="21" letter-spacing="4">LA GREY · ACADEMIA</text><text x="70" y="145" fill="#fff" font-family="Georgia" font-size="54">¿Qué es el <tspan fill="#78d8d2" font-style="italic">passaggio?</tspan></text><text x="72" y="195" fill="#bdd3d6" font-family="Arial" font-size="22">La voz cambia de coordinación al cruzar de una zona a otra.</text><g transform="translate(90,275)"><text x="0" y="0" fill="#dbe9ea" font-family="Arial" font-size="20">GRAVE</text><text x="490" y="0" fill="#eaffff" font-family="Arial" font-size="20">MEDIO</text><text x="1000" y="0" fill="#dbe9ea" font-family="Arial" font-size="20">AGUDO</text><rect x="0" y="55" width="1100" height="34" rx="17" fill="url(#r)"/><rect x="450" y="35" width="235" height="75" rx="22" fill="#062b36" stroke="#bafff9" stroke-width="3"/><text x="480" y="82" fill="#eaffff" font-family="Arial" font-size="19">ZONA DE TRANSICIÓN</text><path d="M40 150 C280 260 380 40 560 150 S850 250 1050 110" fill="none" stroke="#73ded7" stroke-width="7" stroke-linecap="round"/><g fill="#eaffff"><circle cx="40" cy="150" r="9"/><circle cx="560" cy="150" r="12"/><circle cx="1050" cy="110" r="9"/></g></g><rect x="120" y="545" width="1040" height="90" rx="20" fill="#061820" fill-opacity=".55"/><text x="640" y="584" text-anchor="middle" fill="#f1f8f8" font-family="Georgia" font-size="27">Es una zona donde la voz necesita reorganizarse</text><text x="640" y="620" text-anchor="middle" fill="#79dcd6" font-family="Georgia" font-style="italic" font-size="27">sin aumentar presión ni perseguir la nota.</text><text x="70" y="680" fill="#8faeb2" font-family="Arial" font-size="14" letter-spacing="4">TÉCNICA · EXPRESIÓN · ADORACIÓN</text></svg>