<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720"><defs><linearGradient id="b"><stop stop-color="#071b27"/><stop offset="1" stop-color="#0a4551"/></linearGradient></defs><rect width="1280" height="720" fill="url(#b)"/><text x="70" y="80" fill="#9fe8e2" font-family="Arial" font-size="21" letter-spacing="4">LA GREY · ACADEMIA</text><text x="70" y="150" fill="#fff" font-family="Georgia" font-size="48">Aplicación al <tspan fill="#78d8d2" font-style="italic">repertorio de alabanza</tspan></text><text x="72" y="200" fill="#bdd3d6" font-family="Arial" font-size="21">La técnica sirve a la frase, no al revés.</text><g transform="translate(110,285)"><line x1="0" y1="0" x2="1060" y2="0" stroke="#587b81"/><line x1="0" y1="40" x2="1060" y2="40" stroke="#587b81"/><line x1="0" y1="80" x2="1060" y2="80" stroke="#587b81"/><line x1="0" y1="120" x2="1060" y2="120" stroke="#587b81"/><line x1="0" y1="160" x2="1060" y2="160" stroke="#587b81"/><rect x="430" y="-25" width="220" height="210" rx="18" fill="#63d8d1" fill-opacity=".14" stroke="#71ddd6"/><text x="540" y="-40" text-anchor="middle" fill="#9ff1ec" font-family="Arial" font-size="16">ZONA DE TRANSICIÓN</text><path d="M65 135 C210 130 280 95 390 100 S520 25 625 55 S760 110 930 75" fill="none" stroke="#efffff" stroke-width="6"/><g fill="#75ddd6"><circle cx="65" cy="135" r="11"/><circle cx="390" cy="100" r="11"/><circle cx="540" cy="42" r="13"/><circle cx="625" cy="55" r="11"/><circle cx="930" cy="75" r="11"/></g><text x="60" y="220" fill="#eaffff" font-family="Georgia" font-size="30">“Santo eres, mi Señor”</text></g><g font-family="Arial" font-size="18"><rect x="100" y="565" width="330" height="62" rx="18" fill="#0a2a34"/><text x="265" y="603" text-anchor="middle" fill="#e8f5f5">No empujes la nota alta</text><rect x="475" y="565" width="330" height="62" rx="18" fill="#0a2a34"/><text x="640" y="603" text-anchor="middle" fill="#e8f5f5">Ajusta apenas si hace falta</text><rect x="850" y="565" width="330" height="62" rx="18" fill="#0a2a34"/><text x="1015" y="603" text-anchor="middle" fill="#e8f5f5">Mantén intención y claridad</text></g><text x="70" y="680" fill="#8faeb2" font-family="Arial" font-size="14" letter-spacing="4">TÉCNICA · EXPRESIÓN · ADORACIÓN</text></svg>