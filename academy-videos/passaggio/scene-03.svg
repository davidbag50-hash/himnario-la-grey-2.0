<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720"><defs><linearGradient id="b"><stop stop-color="#071d29"/><stop offset="1" stop-color="#0b4653"/></linearGradient></defs><rect width="1280" height="720" fill="url(#b)"/><text x="70" y="78" fill="#9fe8e2" font-family="Arial" font-size="21" letter-spacing="4">LA GREY · ACADEMIA</text><text x="70" y="150" fill="#fff" font-family="Georgia" font-size="55">Qué <tspan fill="#ff9b70">NO</tspan> hacer</text><text x="73" y="192" fill="#82d9d4" font-family="Georgia" font-size="27" font-style="italic">en el passaggio</text><g font-family="Arial"><g transform="translate(70,250)"><rect width="260" height="300" rx="24" fill="#0a2631" stroke="#ee8e68"/><text x="28" y="52" fill="#ff9b70" font-size="34">⚠</text><text x="70" y="52" fill="#fff" font-size="24">Empujar pecho</text><path d="M130 95 v90 M90 130 h80 M90 145 l-35 20 M170 145 l35 20" stroke="#ff9b70" stroke-width="8" fill="none" stroke-linecap="round"/><text x="28" y="235" fill="#cbdcdf" font-size="18">No cargues más peso</text><text x="28" y="263" fill="#cbdcdf" font-size="18">solo porque subes.</text></g><g transform="translate(370,250)"><rect width="260" height="300" rx="24" fill="#0a2631" stroke="#ee8e68"/><text x="28" y="52" fill="#ff9b70" font-size="34">⚠</text><text x="70" y="52" fill="#fff" font-size="23">Levantar barbilla</text><path d="M92 185 C130 170 160 135 165 95 M165 95 l-18 24 M165 95 l20 16" stroke="#ff9b70" stroke-width="8" fill="none"/><text x="28" y="235" fill="#cbdcdf" font-size="18">La altura no sale del</text><text x="28" y="263" fill="#cbdcdf" font-size="18">cuello ni de la cabeza.</text></g><g transform="translate(670,250)"><rect width="260" height="300" rx="24" fill="#0a2631" stroke="#ee8e68"/><text x="28" y="52" fill="#ff9b70" font-size="34">⚠</text><text x="70" y="52" fill="#fff" font-size="24">Gritar</text><circle cx="110" cy="140" r="38" fill="none" stroke="#ff9b70" stroke-width="7"/><path d="M150 126 q45 15 0 30 M165 110 q70 30 0 62" fill="none" stroke="#ff9b70" stroke-width="7"/><text x="28" y="235" fill="#cbdcdf" font-size="18">Más volumen no arregla</text><text x="28" y="263" fill="#cbdcdf" font-size="18">la coordinación.</text></g><g transform="translate(970,250)"><rect width="240" height="300" rx="24" fill="#0a2631" stroke="#ee8e68"/><text x="25" y="52" fill="#ff9b70" font-size="34">⚠</text><text x="65" y="52" fill="#fff" font-size="21">Repetir con tensión</text><path d="M65 130 a58 58 0 1 1 15 55" fill="none" stroke="#ff9b70" stroke-width="8"/><path d="M72 183 l10 26 24-13" fill="none" stroke="#ff9b70" stroke-width="8"/><text x="25" y="235" fill="#cbdcdf" font-size="18">La repetición también</text><text x="25" y="263" fill="#cbdcdf" font-size="18">entrena malos hábitos.</text></g></g><text x="640" y="625" text-anchor="middle" fill="#fff" font-family="Georgia" font-size="28">Más presión <tspan fill="#ff9b70" font-style="italic">no significa</tspan> mejor transición.</text><text x="70" y="680" fill="#8faeb2" font-family="Arial" font-size="14" letter-spacing="4">TÉCNICA · EXPRESIÓN · ADORACIÓN</text></svg>