<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#17324d">
<title>Himnario-Cancionero La Grey</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#15202b;--muted:#6b7785;--accent:#17324d;--border:#e1e7ed;--chord:#0f5d8d;--section:#7a5b1a}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
header{background:linear-gradient(145deg,#17324d,#294f70);color:#fff;padding:26px 18px;position:sticky;top:0;z-index:3}
.wrap{max-width:1100px;margin:auto}
.eyebrow{font-size:12px;letter-spacing:2px;opacity:.72}
.title{font-size:30px;font-weight:800;margin-top:5px}
main{max-width:1100px;margin:auto;padding:20px 14px 90px}
.search input{width:100%;padding:15px 16px;border:1px solid var(--border);border-radius:14px;font-size:16px;background:white}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-top:18px}
.card,.song,.head,.chart{background:var(--card);border:1px solid var(--border);border-radius:18px;box-shadow:0 5px 16px rgba(23,50,77,.05)}
.card{padding:20px;cursor:pointer} .icon{font-size:28px} .card h2{margin:8px 0 4px} .muted{color:var(--muted)}
.count{font-size:13px;margin-top:8px;color:var(--accent);font-weight:700}
.list{display:grid;gap:9px;margin-top:15px}
.song{display:flex;justify-content:space-between;align-items:center;padding:15px 16px;cursor:pointer}
.song:hover{border-color:#c8d3dd}
.tone{font-weight:800;color:var(--accent);background:#eef3f7;padding:6px 10px;border-radius:999px}
.hidden{display:none}
.back{border:0;background:none;color:var(--accent);font-size:15px;margin:4px 0 15px;cursor:pointer}
.head{padding:20px}
.head h1{margin:0 0 6px;font-size:29px}
.artist{color:var(--muted);margin:0}
.meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.badge{display:inline-block;background:#f3ead8;color:#73541c;border-radius:999px;padding:5px 10px;font-size:13px;font-weight:700}
.actions{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--border);background:white;border-radius:11px;padding:9px 13px;cursor:pointer}
.chart{margin-top:14px;padding:18px 16px;overflow-x:auto}
.chart-inner{min-width:max-content;font-family:Consolas,"Courier New",monospace;font-size:17px;line-height:1.48;white-space:pre}
.line{min-height:1.48em}
.section{color:var(--section);font-weight:800}
.chord{color:var(--chord);font-weight:800}
nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--border);display:flex;justify-content:center;gap:24px;padding:10px;z-index:4}
nav button{border:0;background:none;color:var(--muted);cursor:pointer}
@media(max-width:700px){
  .grid{grid-template-columns:1fr}
  .title{font-size:24px}
  .head h1{font-size:25px}
  .chart{padding:15px 10px}
  .chart-inner{font-size:15px}
}
</style>

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="La Grey">

</head>
<body>
<header><div class="wrap"><div class="eyebrow">GRUPO DE ALABANZA</div><div class="title">Himnario-Cancionero La Grey</div></div></header>
<main>
<section id="home">
<div class="search"><input id="q" placeholder="🔎 Buscar canto o grupo..." oninput="searchSongs()"></div>
<div class="grid">
<div class="card" onclick="showList('cantos')"><div class="icon">🎵</div><h2>Cantos</h2><div class="muted">Repertorio de cantos</div><div class="count">6 cantos</div></div>
<div class="card" onclick="showList('himnos')"><div class="icon">🎼</div><h2>Himnos</h2><div class="muted">Repertorio de himnos</div><div class="count">0 himnos</div></div>
<div class="card" onclick="showFavorites()"><div class="icon">⭐</div><h2>Favoritos</h2><div class="muted">Acceso rápido</div></div>
</div>
<div id="results" class="list hidden"></div>
</section>

<section id="listing" class="hidden">
<button class="back" onclick="goHome()">← Volver</button>
<h1 id="listTitle"></h1>
<div id="songList" class="list"></div>
</section>

<section id="detail" class="hidden">
<button class="back" onclick="goBack()">← Volver</button>
<div class="head">
<h1 id="songTitle"></h1>
<p id="songArtist" class="artist"></p>
<div class="meta"><span class="badge">Canto</span><span class="tone">Tono: <span id="songTone"></span></span></div>
<div class="actions">
<button class="btn" onclick="changeFont(-1)">A−</button>
<button class="btn" onclick="changeFont(1)">A+</button>
<button class="btn" onclick="toggleFavorite()">☆ Favorito</button>
<button class="btn hidden" id="installBtn">⬇ Instalar app</button>
</div>
</div>
<div class="chart"><div id="chart" class="chart-inner"></div></div>
</section>
</main>

<nav>
<button onclick="goHome()">⌂ Inicio</button>
<button onclick="showList('cantos')">🎵 Cantos</button>
<button onclick="showList('himnos')">🎼 Himnos</button>
<button onclick="goHome();setTimeout(()=>document.getElementById('q').focus(),50)">🔎 Buscar</button>
</nav>

let current=null,lastType="cantos",fontSize=17;
const favs=()=>JSON.parse(localStorage.getItem("lagrey_favs")||"[]");
const saveFavs=a=>localStorage.setItem("lagrey_favs",JSON.stringify(a));
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function hideAll(){["home","listing","detail"].forEach(id=>document.getElementById(id).classList.add("hidden"))}
function goHome(){hideAll();document.getElementById("home").classList.remove("hidden");window.scrollTo(0,0)}
function renderList(arr,target="songList"){
  const el=document.getElementById(target);
  el.innerHTML=arr.length?arr.map(s=>`<div class="song" onclick="openSong(${s.id})"><div><b>${s.title}</b><br><small class="muted">${s.artist}</small></div><span class="tone">${s.tone}</span></div>`).join(""):"<p class='muted'>Todavía no hay contenido aquí.</p>";
}
function showList(type){
  lastType=type;hideAll();document.getElementById("listing").classList.remove("hidden");
  document.getElementById("listTitle").textContent=type==="cantos"?"🎵 Cantos":"🎼 Himnos";
  renderList(songs.filter(s=>s.type===type));
}
function showFavorites(){
  lastType="fav";hideAll();document.getElementById("listing").classList.remove("hidden");
  document.getElementById("listTitle").textContent="⭐ Favoritos";
  renderList(songs.filter(s=>favs().includes(s.id)));
}
function isSection(line){
  const t=line.trim().toUpperCase();
  return /^\[.*\]$/.test(t) || /^(INTRO|VERSO|CORO|PUENTE|SOLO|1ºVERSO|2ºVERSO|3ºVERSO|PRIMEIRA PARTE|SEGUNDA PARTE|TERCEIRA PARTE)/.test(t);
}
function isChordLine(line){
  const t=line.trim();
  if(!t) return false;
  if(/^[\[(].*[\])]$/.test(t) && /[A-G]/.test(t)) return true;
  return !/[áéíóúÁÉÍÓÚñÑ¿?¡!,;:]/.test(t) &&
    t.split(/\s+/).every(tok =>
      tok==="" ||
      /^[A-G](?:#|b)?(?:m|maj|sus|dim|aug|add)?\d*(?:\/[A-G](?:#|b)?)?\.?$/.test(tok) ||
      /^[|xX\[\]()\/\-]+$/.test(tok)
    );
}
function renderChart(text){
  return text.split("\n").map(line=>{
    let cls="line";
    if(isSection(line)) cls+=" section";
    else if(isChordLine(line)) cls+=" chord";
    return `<div class="${cls}">${esc(line)||"&nbsp;"}</div>`;
  }).join("");
}
function openSong(id){
  current=songs.find(s=>s.id===id);
  hideAll();document.getElementById("detail").classList.remove("hidden");
  document.getElementById("songTitle").textContent=current.title;
  document.getElementById("songArtist").textContent=current.artist;
  document.getElementById("songTone").textContent=current.tone;
  document.getElementById("chart").innerHTML=renderChart(current.content);
  document.getElementById("chart").style.fontSize=fontSize+"px";
  window.scrollTo(0,0);
}
function goBack(){lastType==="fav"?showFavorites():showList(lastType)}
function toggleFavorite(){
  let a=favs();
  a.includes(current.id)?a=a.filter(x=>x!==current.id):a.push(current.id);
  saveFavs(a);
  alert(a.includes(current.id)?"Añadido a favoritos":"Quitado de favoritos");
}
function changeFont(n){
  fontSize=Math.max(12,Math.min(27,fontSize+n));
  document.getElementById("chart").style.fontSize=fontSize+"px";
}
function searchSongs(){
  const q=document.getElementById("q").value.trim().toLowerCase(), r=document.getElementById("results");
  if(!q){r.classList.add("hidden");r.innerHTML="";return}
  const found=songs.filter(s=>s.title.toLowerCase().includes(q)||s.artist.toLowerCase().includes(q));
  r.classList.remove("hidden");
  r.innerHTML=found.length?found.map(s=>`<div class="song" onclick="openSong(${s.id})"><div><b>${s.title}</b><br><small class="muted">${s.artist}</small></div><span class="tone">${s.tone}</span></div>`).join(""):"<p class='muted'>No encontramos coincidencias.</p>";
}
</script>

<script>
let deferredPrompt = null;
const installBtn = document.getElementById("installBtn");

window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredPrompt = e;
  if (installBtn) installBtn.classList.remove("hidden");
});

if (installBtn) {
  installBtn.addEventListener("click", async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    installBtn.classList.add("hidden");
  });
}

window.addEventListener("appinstalled", () => {
  if (installBtn) installBtn.classList.add("hidden");
});

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js");
  });
}
</script>

</body>
